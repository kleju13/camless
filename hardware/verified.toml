# Hardware camless was run on and reported working. The app and `camless status`
# read this list from the build.
#
# A setup is verified when every device camless drives in it is listed here. On any
# other, the app says the setup has not been verified yet, and offers two reports:
# "It works" and "Something is wrong". Both open a GitHub issue with the hardware
# report filled in. A "works" report adds its device here, with that issue as the
# source.
#
# usb       the USB id, vendor:product in lowercase hex, as in `camless report`
# name      what people call the device
# firmware  the firmware versions it was reported on; leave it out if unknown
# checked   what was tried on it: pump, fans, lighting, lcd
# source    the issue that reported it, or who ran it

[[device]]
usb = "1e71:3012"
name = "Kraken Elite 2024 (Kraken Elite V2)"
checked = ["pump", "fans", "lighting", "lcd"]
source = "the maintainer's hardware"

[[device]]
usb = "1e71:2022"
name = "Control Hub (the one in the H9 Flow RGB+)"
checked = ["fans", "lighting"]
source = "the maintainer's hardware"

[[device]]
usb = "1e71:300e"
name = "Kraken 2023 (Kraken Base)"
checked = ["pump", "fans"]
source = "https://github.com/kleju13/camless/issues/29"

[[device]]
usb = "1e71:300c"
name = "Kraken Elite 2023"
firmware = ["2.1.0"]
checked = ["pump", "lcd"]
source = "https://github.com/kleju13/camless/issues/42"

[[device]]
usb = "1e71:2020"
name = "RGB & Fan Controller (3+6 channels)"
firmware = ["1.7.0"]
checked = ["fans", "lighting"]
source = "its owner, on Reddit, on camless 0.5.1-beta.1 and beta.2"

[[device]]
usb = "1e71:2021"
name = "RGB Controller (2023)"
firmware = ["1.5.0"]
checked = ["lighting"]
source = "its owner, on Reddit, on camless 0.5.1-beta.1 and beta.2"
