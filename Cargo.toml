[workspace]
members = [".", "core", "gui"]

[package]
name = "camless"
version = "0.5.1-beta.1"
edition = "2021"
description = "A small replacement for NZXT CAM: pump, fan, lighting and LCD control for NZXT devices"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
camless-core = { path = "core" }
nusb = "0.1"
libloading = "0.8"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tiny_http = "0.12"
# Decodes the frames a browser renders for an LCD in web mode.
png = "0.18"
# Packs the frames of a background a page hands over; png uses the same version.
miniz_oxide = "0.8"

[target.'cfg(windows)'.dependencies]
hidapi = { version = "2", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.61", features = [
    # Any graphics card's temperature and load, as Task Manager reads them.
    "Wdk_Graphics_Direct3D",
    # HYTE's and iBUYPOWER's hubs: serial ports, found by their USB ids.
    "Win32_Devices_Communication",
    "Win32_Devices_DeviceAndDriverInstallation",
    # Lian Li hubs: input reports on request, which hidapi's Windows backend lacks.
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Etw",
    # Other brands' apps, which camless leaves their devices to.
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    # ETW's log file struct holds a time zone.
    "Win32_System_Time",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# hidapi's own C library on hidraw, the backend liquidctl uses on Linux.
hidapi = { version = "2", default-features = false, features = ["linux-static-hidraw"] }
# Signals, the browser's process group and hidraw.
libc = "0.2"

[build-dependencies]
# Puts gui/camless.ico into camless.exe.
embed-resource = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
