[package]
name = "camless"
version = "0.1.0"
edition = "2021"
description = "A small replacement for NZXT CAM: pump, fan, lighting and LCD control for the Kraken Elite V2 and the Control Hub"
publish = false

[dependencies]
hidapi = { version = "2", default-features = false, features = ["windows-native"] }
nusb = "0.1"
futures-lite = "2"
libloading = "0.8"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tiny_http = "0.12"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
