<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<title>camless: by device</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/cam-kit.css">
<style>
  .dev-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }
  .dev-card { display: flex; align-items: center; gap: 16px; padding: 14px 16px; color: inherit; text-decoration: none; }
  .dev-card:hover { border-color: var(--cool); }
  .dev-card canvas { width: 64px; height: 64px; flex: none; }
  .dev-card .who { flex: 1; min-width: 0; display: grid; gap: 3px; }
  .dev-card .who b { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dev-card .nums { display: flex; gap: 18px; }
  .dev-card .chev { color: var(--cool); transform: rotate(-90deg); }
  .dev-head { display: flex; align-items: center; flex-wrap: wrap; gap: 16px 22px; padding: 16px 20px; margin-bottom: 18px; }
  .dev-head canvas { width: 88px; height: 88px; flex: none; }
  .dev-id { flex: 1; min-width: 180px; display: grid; gap: 4px; justify-items: start; }
  .stat { display: grid; gap: 1px; }
  .stat span { font-size: 12px; color: var(--t3); white-space: nowrap; }
  .stat b { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .stat b small { font-size: 12px; font-weight: 500; color: var(--t3); margin-left: 3px; }
  .dev-stats { display: flex; flex-wrap: wrap; gap: 12px 28px; }
  @container area (max-width: 879px) { .dev-cards { grid-template-columns: minmax(0, 1fr); } }
  @container area (max-width: 519px) {
    .dev-head { padding: 14px; }
    .dev-head canvas { width: 64px; height: 64px; }
    .dev-stats { width: 100%; justify-content: space-between; gap: 10px 16px; }
    .dev-card .nums { display: none; }
  }
</style>
</head>
<body>
<script src="../shared/camless-sim.js"></script>
<script src="../shared/kraken-draw.js"></script>
<script src="../shared/curve-editor.js"></script>
<script src="../shared/cam-kit.js"></script>
<script>
/* The same CAM look, sorted by device: each device in the left bar has its own
   Cooling, Lighting and LCD Display tabs. */
(function () {
  'use strict';
  const C = window.Camless, X = window.CamKit, h = X.h;
  const D = C.devices;

  // Live numbers: the full set in a device's header, the first two on its overview card.
  const rpmOf = (id) => `${X.rpm((C.live(id) || {}).rpm)}<small>RPM</small>`;
  const STATS = {
    kraken: [
      ['Liquid', (s) => `${X.tnum(s.liquid)}<small>${X.deg()}</small>`],
      ['Pump', () => rpmOf('pump')],
      ['Fan', () => rpmOf('radiator')],
    ],
    hub: [
      ['Fans', () => `${C.config.hub_fan.length}<small>of ${D.hub.ports}</small>`],
      ...C.config.hub_fan.map((f) => [`Fan ${f.port}`, () => rpmOf('hub' + f.port)]),
    ],
  };
  function stats(host, d, n) {
    const els = STATS[d].slice(0, n).map(([k, f]) => { const el = h('<div class="stat"><span></span><b></b></div>'); el.firstElementChild.textContent = k; host.appendChild(el); return [el.lastElementChild, f]; });
    const upd = () => { const s = C.snapshot(); for (const [b, f] of els) b.innerHTML = f(s); };
    X.track(C.on('tick', upd));
    X.track(X.on('prefs', upd));
    upd();
  }
  function thumb(cv, d) {
    let t = 0;
    X.track(C.on('frame', (dt) => { t += dt; X.deviceThumb(cv, d, t); }));
  }

  function overview(host) {
    X.pageHead(host, 'PC Monitoring');
    const cards = h('<div class="dev-cards"></div>');
    for (const d of ['kraken', 'hub']) {
      const a = h(`<a class="cam-panel dev-card" href="#${d}"><canvas aria-hidden="true"></canvas><span class="who"><b></b><span class="cam-status">Ready</span></span><span class="nums"></span>${X.I.chevron.replace('class="i"', 'class="i chev"')}</a>`);
      a.querySelector('b').textContent = D[d].name;
      a.setAttribute('aria-label', `Open ${D[d].name}`);
      cards.appendChild(a);
      stats(a.querySelector('.nums'), d, 2);
      thumb(a.querySelector('canvas'), d);
    }
    host.appendChild(cards);
    X.monitoring(host);
  }

  const TABS = {
    kraken: [['cooling', 'Cooling'], ['lighting', 'Lighting'], ['lcd', 'LCD Display']],
    hub: [['cooling', 'Cooling'], ['lighting', 'Lighting']],
  };
  function device(d) {
    return (host, sub) => {
      const tabs = TABS[d];
      let tab = tabs.some((t) => t[0] === sub) ? sub : 'cooling';
      const head = h(`<div class="cam-panel dev-head"><canvas aria-hidden="true"></canvas><div class="dev-id"><h1 class="cam-h1"></h1><span class="cam-small"></span><span class="cam-status">Ready</span></div><div class="dev-stats"></div></div>`);
      head.querySelector('h1').textContent = D[d].name;
      head.querySelector('.cam-small').textContent = d === 'kraken' ? `${D.kraken.model}, firmware ${D.kraken.firmware}` : `${D.hub.ports} fan and 5 LED ports, firmware ${D.hub.firmware}`;
      host.appendChild(head);
      stats(head.querySelector('.dev-stats'), d);
      thumb(head.querySelector('canvas'), d);
      const body = h('<div></div>');
      host.append(X.tabStrip(tabs.map(([id, label]) => ({ id, label })), tab, (id) => { tab = id; history.replaceState(null, '', `#${d}/${id}`); show(); }, { label: D[d].name }), body);
      const draw = X.region(body);
      function show() {
        draw((b) => {
          if (tab === 'cooling') X.deviceChannels(b, d, { collapse: true });
          else if (tab === 'lighting') X.lightingPage(b, { devices: [d], lcd: false });
          else X.lcdEditor(b);
        });
      }
      show();
    };
  }

  X.shell({
    nav: [
      { id: 'monitoring', label: 'Monitoring', icon: 'monitoring' },
      { group: 'Devices' },
      { id: 'kraken', label: D.kraken.name, icon: 'kraken', sub: 'Ready' },
      { id: 'hub', label: D.hub.name, icon: 'hub', sub: 'Ready' },
      { spacer: true },
      { id: 'settings', label: 'Settings', icon: 'settings' },
    ],
    initial: 'monitoring',
    pages: {
      monitoring: overview,
      kraken: device('kraken'),
      hub: device('hub'),
      settings(host) { X.pageHead(host, 'Settings'); X.settings(host); },
    },
  });
})();
</script>
<script src="../shared/demo-bar.js" data-position="bottom-right"></script>
</body>
</html>
