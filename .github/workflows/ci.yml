# Tests every push to main and every pull request on Windows and Linux, and builds camless-setup.exe
# and camless-linux-x86_64.tar.gz from it: the run's camless-setup and camless-linux artifacts
# install that exact build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo test --workspace --release
      - run: choco install innosetup --no-progress -y
      - run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: camless-setup
          path: dist/*

  # The oldest Ubuntu the runners have: a build against its glibc runs on the distributions after it.
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libudev-dev
      - run: cargo test --workspace --release
      - run: sh scripts/package-linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: camless-linux
          path: dist/camless-linux-x86_64.tar.gz*
