# Pushing a tag like v0.2.0 builds camless-setup.exe, which installs camless.exe and camless-gui.exe,
# and camless-linux-x86_64.tar.gz, whose install.sh installs camless and camless-gui, and publishes
# both as one GitHub release. scripts/install.ps1 downloads and runs the latest setup.
# A version with a pre-release part, such as v0.5.0-beta.1, comes out as a beta: a GitHub pre-release,
# which only the app's beta channel offers. Every other tag is a release. Betas of a version count up
# (beta.1, beta.2, …) and the version itself follows as the release once they have been tried.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo test --workspace --release --locked
      - run: choco install innosetup --no-progress -y
      # The tag through the environment: written into the script, its name would run as part of it.
      - run: ./scripts/package.ps1 -Tag "$env:TAG"
        env:
          TAG: ${{ github.ref_name }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/camless-setup.exe*

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libudev-dev
      - run: cargo test --workspace --release --locked
      - run: sh scripts/package-linux.sh "$TAG"
        env:
          TAG: ${{ github.ref_name }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: dist/camless-linux-x86_64.tar.gz*

  # Once both are built, so the release never shows up with one of them missing.
  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          beta=
          case "$TAG" in *-*) beta=--prerelease ;; esac
          gh release create "$TAG" dist/camless-setup.exe dist/camless-setup.exe.sha256 \
            dist/camless-linux-x86_64.tar.gz dist/camless-linux-x86_64.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "camless $TAG" --generate-notes $beta
