# Pushing a tag like v0.2.0 builds camless-setup.exe, which installs camless.exe and camless-gui.exe,
# and publishes it as a GitHub release. scripts/install.ps1 downloads and runs the latest one.
# A version that changes only the last number, such as v0.4.1, comes out as a beta: a pre-release,
# which only the app's beta channel offers. `gh release edit v0.4.1 --prerelease=false --latest`
# promotes it to a release once it has been tried.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo test --workspace --release
      - run: choco install innosetup --no-progress -y
      - run: ./scripts/package.ps1 -Tag "${{ github.ref_name }}"
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          beta=--prerelease
          if [ "${TAG##*.}" = "0" ]; then beta=; fi
          gh release create "$TAG" dist/camless-setup.exe dist/camless-setup.exe.sha256 --title "camless $TAG" --generate-notes $beta
